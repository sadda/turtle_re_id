[tool.setuptools.packages.find]
include = ["wildlife_re_id_app*"]

[tool.ruff]
line-length = 250

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "F403", "F405"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]