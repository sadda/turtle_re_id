[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "animal-re-id"
version = "0.1.0"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = [
    "numpy",
    "pandas",
    "networkx",
    "wildlife-datasets @ git+https://github.com/WildlifeDatasets/wildlife-datasets",
]

[project.optional-dependencies]
models = [
    "wildlife-tools @ git+https://github.com/WildlifeDatasets/wildlife-tools",
    "torch",
    "torchvision",
    "timm",
    "transformers<5",
    "accelerate",
    "ultralytics",
    "huggingface_hub",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
]

[tool.setuptools.packages.find]
include = ["animal_re_id*"]

[tool.setuptools.package-data]
animal_re_id = ["data/paths.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 250

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "F403", "F405"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]