site_name: Animal re-identification
repo_url: https://github.com/sadda/turtle_re_id
repo_name: turtle_re_id

theme:
  name: "material"
  features:
    - navigation.sections
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Introduction: index.md
  - Quick start: quickstart.md
  - Installation: installation.md
  - Your own data:
    - Preparing photos: data.md
    - Running the pipeline: running.md
    - Updating the database: updating.md
  - Others:
    - Troubleshooting: troubleshooting.md
